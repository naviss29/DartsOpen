name: Refresh i18n lockfile

on:
  push:
    branches: [feat/i18n-complete-ui]

permissions:
  contents: write
  packages: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@naviss29"
      - run: npm install --package-lock-only
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit regenerated lockfile
        run: |
          rm .github/workflows/refresh-i18n-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git add -u .github/workflows/refresh-i18n-lock.yml
          git commit -m "chore: refresh lockfile for design-system 0.8.2"
          git push
