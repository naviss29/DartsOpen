name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    name: Lint · Tests · Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    # SEC-005 — lib/rateLimit.test.ts exécute de vraies opérations concurrentes (dont une
    # preuve multi-instance à deux PrismaClient distincts) contre un vrai PostgreSQL — jamais
    # un mock : une garantie d'atomicité/partage entre instances ne se prouve pas avec un mock
    # séquentiel. Même image que docker-compose.yml (usage local), même convention que
    # BilletAsso (DATA-001/DATA-002).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: dartsopen
          POSTGRES_USER: dartsopen
          POSTGRES_PASSWORD: dartsopen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dartsopen -d dartsopen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@naviss29"

      # `npm run verify` est la source de vérité (install, génération Prisma, lint, tsc,
      # tests, build) — la CI ne fait que fournir l'environnement éphémère, jamais dupliquer
      # les étapes en parallèle du script (QA-TRANSVERSE-001, Lot 2).
      - name: npm run verify
        run: npm run verify
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_API_URL: https://sterplatform.bapps-studio.com
          NEXT_PUBLIC_BSSITE_URL: https://bapps-studio.com
          # SEC-005 — réel (pas un placeholder) depuis l'ajout de lib/rateLimit.test.ts : `npm
          # run verify` applique désormais les migrations Prisma et exécute des tests de
          # concurrence contre une vraie base — voir le service `postgres` ci-dessus.
          DATABASE_URL: postgresql://dartsopen:dartsopen@localhost:5432/dartsopen
          STER_API_TOKEN: placeholder
          STER_PAYMENTS_CALLBACK_SECRET: placeholder
