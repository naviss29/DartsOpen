name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    name: Lint · Tests · Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@naviss29"

      # `npm run verify` est la source de vérité (install, génération Prisma, lint, tsc,
      # tests, build) — la CI ne fait que fournir l'environnement éphémère, jamais dupliquer
      # les étapes en parallèle du script (QA-TRANSVERSE-001, Lot 2).
      - name: npm run verify
        run: npm run verify
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_API_URL: https://sterplatform.bapps-studio.com
          NEXT_PUBLIC_BSSITE_URL: https://bapps-studio.com
          # Variables runtime (non injectées au build, déclarées pour éviter les warnings Next.js)
          DATABASE_URL: placeholder
          STER_API_TOKEN: placeholder
          STER_PAYMENTS_CALLBACK_SECRET: placeholder
